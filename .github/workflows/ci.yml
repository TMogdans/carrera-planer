# CI-Gates für carrera-planer. Jeder Job ist als Required Check gedacht (Branch Protection).
# Die Datei liegt im geschützten Satz (CODEOWNERS); Workflows pusht nur der Mensch.
#
# Aktionen sind auf Commit-SHAs gepinnt (Version im Kommentar).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merges per Auto-Merge laufen über den GITHUB_TOKEN und lösen deshalb kein push-Ereignis aus
  # (GitHub-Regel gegen Workflow-Ketten). Ohne diesen Auslöser gäbe es nach so einem Merge kein
  # Image. Von Hand starten: Actions → CI → Run workflow auf main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  test:
    name: test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  escape-hatches:
    name: escape-hatches (semgrep)
    runs-on: ubuntu-latest
    # Semgrep ist ein Python-Werkzeug; das offizielle Image bringt es mit.
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --error lässt jeden Fund den Job scheitern. .semgrepignore hält *.test.ts im Scope.
      # deploy/ (Container-Tests, ab M4) kommt dazu, sobald es existiert; ein fehlendes Ziel
      # würde Semgrep sonst als Fehler werten.
      - name: Fluchttür-Wächter
        run: |
          targets="src"
          [ -d deploy ] && targets="$targets deploy"
          semgrep --config .semgrep --error --metrics=off $targets

  mutation:
    name: mutation (stryker)
    runs-on: ubuntu-latest
    # Der Job läuft immer (damit der Required Check nie "pending" bleibt), führt Stryker aber nur
    # aus, wenn der Mutationsscope oder dessen Konfiguration berührt ist. Auf main immer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ist der Mutationsscope berührt?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Kein Pull Request: Mutation läuft immer."
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Geänderte Dateien:"
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '^(src/(core|catalog|schema|server|web/editor)/|stryker\.config\.json$|vitest\.mutation\.config\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Mutationsscope unberührt, Stryker wird übersprungen."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: pnpm run test:mutation

  image:
    name: image (docker, arm64)
    runs-on: ubuntu-24.04-arm
    needs: [typecheck, lint, test]
    # Der Job läuft immer (damit der Required Check nie "pending" bleibt). Er baut erst, wenn
    # M4 umgesetzt ist (Dockerfile UND deploy/docker-compose.yml). Genau eine der beiden
    # Dateien ist ein Fehler. Gebaut wird nativ auf arm64, ohne QEMU.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gibt es schon ein Image zu bauen?
        id: scope
        run: |
          has_df=false; has_cmp=false
          [ -f Dockerfile ] && has_df=true
          [ -f deploy/docker-compose.yml ] && has_cmp=true
          if [ "$has_df" = false ] && [ "$has_cmp" = false ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein Image (M4 nicht umgesetzt)."
          elif [ "$has_df" = true ] && [ "$has_cmp" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile=$has_df, deploy/docker-compose.yml=$has_cmp: nur eine der beiden Dateien vorhanden." >&2
            exit 1
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.scope.outputs.run == 'true'
        name: Image bauen (lokal laden)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: carrera-planer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        name: Container-Tests gegen das gebaute Image
        env:
          CARRERA_IMAGE: carrera-planer
          CARRERA_TAG: ci
        run: pnpm exec vitest run --config vitest.container.config.ts
      - if: steps.scope.outputs.run == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.scope.outputs.run == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        name: Image nach ghcr.io pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tmogdans/carrera-planer:latest
            ghcr.io/tmogdans/carrera-planer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
